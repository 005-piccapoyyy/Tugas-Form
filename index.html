<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas HTML Pa Nauval</title>
</head>
<body>

    <!-- A. Tugas membuat formulir pendaftaran -->
    <h1>Formulir Pendaftaran Ekstrakulikuler</h1>
    <form>
        <label>Nama lengkap</label>
        <input type="text" id="name" name="name"><br><br>
        <label>Kelas</label>
        <select id="class" name="class">
            <option value="1">XII RPL 1</option>
            <option value="2">XII RPL 2</option>
            <option value="3">XII RPL 3</option>    
        </select><br><br>
        <label>jenis kelamin</label> <br>
        <input type="radio" name="gender" value="male">Laki-laki<br> 
        <input type="radio" name="gender" value="female">Perempuan <br> <br>
        <label>ekstrakulikuler</label> <br>
        <select id="class" name="class">
            <option value="1"> Web Programing</option>
            <option value="2"> Desain Grafis</option>
            <option value="3"> Robotika </option>
            <option value="4"> futsal </option>
        </select> <br> <br>
        <label>nomor telepon</label> <br>
        <input type="tel" name="phone" placeholder="Masukkan nomor telepon"> Masukan nomor telepon yang valid <br> <br> 
        <label>alasan mengikuti ekstrakulikuler</label>
        <textarea name="reason" rows="4" cols="50" placeholder="Masukkan alasan mengikuti ekstrakulikuler"></textarea> <br> <br>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form> <br> <br>

    <!--B. Tugas untuk membuat tabel data peserta -->
    <h1>Data Peserta</h1>
    <table border="1" spacing="0" cellpadding="10" >
        <th>Nomor</th>
        <th>Nama siswa</th>
        <th>Kelas</th>
        <th>Jenis kelamin</th>
        <th>Ekstrakulikuler</th>
        <th>Nomor telepon</th>
        <tr>
            <td>1</td>
            <td>Alex Manasye</td>
            <td>XII RPL 1</td>
            <td>Laki-laki</td>
            <td>Web Programming</td>
            <td>081234567890</td>
        </tr>
    </table>

</body>
</html>
